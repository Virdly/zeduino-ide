name: Build

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (main, preload, renderer)
        run: npm run build

      - name: Package portable app
        run: npm run package

      - name: Create release zip
        run: npm run zip

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: ZedArduinoIDE-win64
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14
